# Grader tuning: Haiku, low effort, marking only (no feedback), no self-test.
llm: {backend: claude_cli, model: haiku, effort: low, timeout_s: 240, retries: 2}
judge: {backend: claude_cli, model: haiku, effort: low}
student: {backend: claude_cli, model: haiku, effort: low}
pipeline:
  rubric_selftest: false
  read_first: true
  rubric_variant: lean
  with_feedback: false
  max_workers: 6
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
