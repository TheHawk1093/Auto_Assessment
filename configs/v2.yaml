# v2: marking schemes sized to the model answer, and code (not the model) prices each verdict.
llm:
  backend: claude_cli
  model: sonnet
  timeout_s: 240
  retries: 2
judge:
  backend: claude_cli
  model: haiku
pipeline:
  rubric_selftest: true
  read_first: true
  evidence_policy: flag
  policy: essence
  mark_rule: status
  partial_weight: 0.9
  rubric_variant: sized
  grade_retries: 1
  max_workers: 4
