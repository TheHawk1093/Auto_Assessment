# Indic handwriting: plain transcription (no exam-sheet structure), best free reader first.
# Chosen on the tune pages only (CER Gemini 3.1 Lite 14.4%, 3.5 Lite 18.6%, Sonnet 24.9%, Haiku 43%).
# Use: autograde --config configs/experiments/ocr/ocr_indic.yaml ocr <folder> --per-page --out runs/<name>
ocr:
  reader: {provider: gemini, model: gemini-3.1-flash-lite, plain: true}
  fallbacks:
    - {provider: gemini, model: gemini-3.5-flash-lite, plain: true}
    - {provider: openrouter, model: "dots-studio/dots-3-note-preview:free", plain: true}
llm: {backend: goedel, model: "deepseek/deepseek-v4.1-flash", timeout_s: 300, retries: 2}
judge: {backend: claude_cli, model: haiku, effort: low}
student: {backend: claude_cli, model: haiku, effort: low}
pipeline: {max_workers: 3}
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}

# Bodhan IndicOCR, only ever used on pages the chain read as Indic script (see `classify`).
# Add INDIC_OCR_API_KEY to .env, set its model name below and uncomment:
#   routes:
#     - {when: indic, reader: {provider: bodhan, model: "<model name from the Bodhan console>"}}
