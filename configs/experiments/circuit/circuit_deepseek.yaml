# EDU-CIRCUIT-HW: handwritten circuit solutions, marked against the TA rubric. Gemini free tier
# reads the pages (python -m autograde.datasets.circuit --config configs/experiments/circuit/circuit_gemini.yaml) and
# marks the transcripts. Use: autograde --config configs/experiments/circuit/circuit_gemini.yaml run --dataset circuit_hw
#   --split dev -n 24 --mode pipeline --name circuit_dev --no-commit
llm: {backend: goedel, model: "deepseek/deepseek-v4.1-flash", timeout_s: 300, retries: 2}
judge: {backend: gemini, model: gemini-3.1-flash-lite}
student: {backend: gemini, model: gemini-3.1-flash-lite}
ocr:
  reader: {provider: gemini, model: gemini-3.1-flash-lite}
pipeline:
  rubric_selftest: false
  read_first: false
  rubric_variant: solid
  with_feedback: true
  max_workers: 2
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
