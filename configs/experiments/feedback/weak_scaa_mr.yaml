# Feedback test with a weak student (Gemini Flash Lite) instead of Haiku. Marathi marking and native-language feedback by DeepSeek (free via Goedel); Haiku (a different
llm: {backend: goedel, model: "deepseek/deepseek-v4.1-flash", timeout_s: 300, retries: 2}
judge: {backend: claude_cli, model: haiku, effort: low}
student: {backend: gemini, model: gemini-3.1-flash-lite}  # the weakest student: only the feedback can help it
pipeline:
  rubric_selftest: false
  read_first: false
  rubric_variant: solid
  with_feedback: true
  feedback_language: Marathi
  max_workers: 3
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
