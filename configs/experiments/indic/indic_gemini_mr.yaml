# Marking and feedback in Indic languages with Google Gemini (free tier, no Claude, no DeepSeek).
# Gemini 3.1 Pro has no free quota on this key (limit 0), so Flash Lite does the work.
# Use: autograde --config configs/experiments/indic/indic_gemini.yaml run --dataset scaa_marathi --split dev -n 40 \
#        --mode baseline --name scaa_mr_baseline
llm: {backend: gemini, model: gemini-3.1-flash-lite, timeout_s: 240, retries: 2}
judge: {backend: gemini, model: gemini-3.1-flash-lite}
student: {backend: gemini, model: gemini-3.1-flash-lite}
pipeline:
  rubric_selftest: false
  read_first: false
  rubric_variant: solid
  with_feedback: true
  feedback_language: Marathi
  max_workers: 2
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
