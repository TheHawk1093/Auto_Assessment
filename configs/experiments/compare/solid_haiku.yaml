# Solid scheme writer: Sonnet writes (and reviews) the schemes, Haiku marks. Marking only.
llm: {backend: claude_cli, model: haiku, effort: low, timeout_s: 300, retries: 2}
judge: {backend: claude_cli, model: haiku, effort: low}
student: {backend: claude_cli, model: haiku, effort: low}
pipeline:
  rubric_selftest: true
  rubric_variant: solid
  rubric_model: sonnet
  strong_backend: claude_cli
  rubric_review: no_reference
  read_first: true
  with_feedback: false
  max_workers: 4
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
