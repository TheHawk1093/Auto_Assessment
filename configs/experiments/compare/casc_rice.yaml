# Cascade test on RiceChem: Haiku marks with deductions, Sonnet re-marks answers where a deduction fired.
llm: {backend: claude_cli, model: haiku, effort: medium, timeout_s: 300, retries: 2}
judge: {backend: claude_cli, model: haiku, effort: low}
student: {backend: claude_cli, model: haiku, effort: low}
pipeline:
  rubric_selftest: false
  read_first: true
  rubric_variant: official
  with_feedback: false
  max_workers: 6
  rubric_model: null
  deductions: true
  escalate_model: sonnet
  escalate_when: [deduction]
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
