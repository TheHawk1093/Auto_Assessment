# Scheme style A/B, teacher setting: core style plus strictness "lenient" (a teacher who gives
# full marks for the central idea in any wording). Only a teacher with that habit should use it.
llm: {backend: goedel, model: "deepseek/deepseek-v4.1-flash", timeout_s: 300, retries: 2}
pipeline:
  rubric_selftest: false
  read_first: false
  rubric_variant: solid.core
  teacher: {strictness: lenient}
  with_feedback: false
  max_workers: 3
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
