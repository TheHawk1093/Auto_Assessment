# Scheme style A/B, control: the solid writer as it was. DeepSeek marks; no feedback (measurement
# shortcut), so only the marks are compared. Run with scripts/style_ab.sh.
llm: {backend: goedel, model: "deepseek/deepseek-v4.1-flash", timeout_s: 300, retries: 2}
pipeline:
  rubric_selftest: false
  read_first: false
  rubric_variant: solid
  with_feedback: false
  max_workers: 3
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
