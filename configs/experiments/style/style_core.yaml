# Scheme style A/B, treatment: the solid writer plus the "core" style (prompts/rubric.style.core).
llm: {backend: goedel, model: "deepseek/deepseek-v4.1-flash", timeout_s: 300, retries: 2}
pipeline:
  rubric_selftest: false
  read_first: false
  rubric_variant: solid.core
  with_feedback: false
  max_workers: 3
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
