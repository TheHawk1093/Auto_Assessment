# Default settings. Override with: autograde run --config configs/other.yaml
llm:                        # grader, rubric writer, feedback writer
  backend: openrouter       # every call goes through OpenRouter (needs OPENROUTER_API_KEY)
  model: openai/gpt-5.4-mini   # OpenRouter model id
  timeout_s: 240
  retries: 2                # transport / schema-validation retries per call

judge:                      # scores feedback quality; use a different provider than `llm` when possible
  backend: openrouter
  model: anthropic/claude-haiku-4.5
  timeout_s: 240
  retries: 2

pipeline:
  rubric_selftest: true     # check each generated scheme on the model answer and a blank answer
  read_first: true          # first pass reads the answer alone, then marking uses that reading
  evidence_policy: flag     # strict: drop credit whose quote is not found | flag: keep and report
  policy: essence           # essence: judge the central idea | literal: original wording
  mark_rule: status         # status: code turns each verdict into marks | model: model's own marks
  partial_weight: 0.5       # share of a point's marks for a partial verdict
  rubric_variant: sized     # sized: points sized to the model answer | generated: original
  grade_retries: 1          # re-mark once if the checks fail
  max_workers: 4            # parallel calls

paths:
  data_dir: data/raw
  rubrics_dir: output/rubrics
  runs_dir: output/runs
  logs_dir: output/logs
