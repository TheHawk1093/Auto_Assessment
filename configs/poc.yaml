# Proof of concept: DeepSeek V4.1 Flash for every job, no self-test, no extra votes.
# Use with small samples: autograde --config configs/poc.yaml poc
llm: {backend: openrouter, model: "deepseek/deepseek-v4.1-flash", timeout_s: 240, retries: 2}
judge: {backend: openrouter, model: "anthropic/claude-haiku-4.5"}
student: {backend: openrouter, model: "anthropic/claude-haiku-4.5"}
pipeline:
  rubric_selftest: false
  read_first: true
  rubric_variant: sized
  votes: 1
  max_workers: 4
paths: {data_dir: data/raw, rubrics_dir: output/rubrics, runs_dir: output/runs, logs_dir: output/logs}
