# Different models for different tasks, free where possible.
# Reading (photos -> text): free Gemini first; if it fails on a page, the next reader is tried.
# Marking: DeepSeek via Goedel (free). Rubrics: Sonnet via the Claude CLI. Judge and student: Haiku.
# Use: autograde --config configs/ocr_free.yaml ocr <folder> --per-page --out runs/<name>
ocr:
  reader: {provider: gemini, model: gemini-3.5-flash-lite}
  fallbacks:
    - {provider: gemini, model: gemini-3.1-flash-lite}
    - {provider: gemini, model: gemma-4-26b-a4b-it, plain: true}
    - {provider: openrouter, model: "dots-studio/dots-3-note-preview:free", plain: true}
    - {provider: claude_cli, model: haiku}
  # Optional: re-read a page with a specialist when its text looks like this kind (german | math).
  # Not enabled: on our 9 pages the first reader was already best on every kind of page.
  # routes:
  #   - {when: math, reader: {provider: openrouter, model: "some/free-model:free"}}
llm: {backend: goedel, model: "deepseek/deepseek-v4.1-flash", timeout_s: 300, retries: 2}
judge: {backend: claude_cli, model: haiku, effort: low}
student: {backend: claude_cli, model: haiku, effort: low}
pipeline:
  rubric_selftest: false
  read_first: true
  rubric_variant: sized
  with_feedback: false
  max_workers: 6
  rubric_model: sonnet
  strong_backend: claude_cli
paths: {data_dir: data/raw, rubrics_dir: rubrics, runs_dir: runs}
