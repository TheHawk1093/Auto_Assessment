# Marking a whole exam end to end through OpenRouter (DeepSeek V4.1 Flash by default):
# it reads the files, writes the marking schemes, marks, and writes the feedback.
# Swap rubric_model for a stronger scheme writer, e.g. {rubric_model: anthropic/claude-haiku-4.5}.
# The app writes a per-exam copy of this file with the teacher's model and reader.
llm: {backend: openrouter, model: "deepseek/deepseek-v4.1-flash", timeout_s: 300, retries: 2}
judge: {backend: openrouter, model: "anthropic/claude-haiku-4.5"}
student: {backend: openrouter, model: "anthropic/claude-haiku-4.5"}
pipeline:
  rubric_variant: solid
  rubric_model: "deepseek/deepseek-v4.1-flash"
  strong_backend: openrouter
  rubric_selftest: true
  rubric_review: no_reference
  read_first: true
  with_feedback: true
  feedback_variant: formal
  max_workers: 4
# Reading photographed sheets. The main reader is tried first. If it fails, reads nothing, or
# reads doubtfully, the next fallback is tried, in order. Providers: openrouter (OPENROUTER_API_KEY)
# and bodhan (INDIC_OCR_API_KEY). A run stops if an OpenRouter reader's reported cost passes $1
# (raise it with AUTOGRADE_OCR_CAP_USD). Bodhan is about Rs 0.20 an image, capped at Rs 30.
ocr:
  reader: {provider: openrouter, model: "google/gemini-3.5-flash-lite"}
  fallbacks:
    - {provider: openrouter, model: "google/gemini-3.6-flash"}
    - {provider: bodhan, model: "indic-ocr"}
  # Pages that look Hindi, Marathi or another Indian script (30% or more of the letters) are also
  # re-read by the specialist, even when the main reader was clean:
  routes:
    - {when: indic, reader: {provider: bodhan, model: "indic-ocr"}}
paths: {data_dir: data/raw, rubrics_dir: output/rubrics, runs_dir: output/runs, logs_dir: output/logs}
