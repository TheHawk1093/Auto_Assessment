<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Styles</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root {
  --bg: #f7f7f9; --card: #ffffff; --ink: #1c1d21; --muted: #666a73; --line: #e2e3e8;
  --accent: #2457c5; --accent-soft: #e6edfb; --good: #1d7a3e; --good-soft: #e3f4e8;
  --warn: #a15c00; --warn-soft: #fdf0dc; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121316; --card: #1b1c20; --ink: #ececf0; --muted: #9a9ca6; --line: #32343b;
    --accent: #8aa9ff; --accent-soft: #232c45; --good: #6fd08c; --good-soft: #1d3326;
    --warn: #f0b45a; --warn-soft: #3a2d15;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
header, main { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding: 0 20px; max-width: 1400px; margin: 0 auto; }
.tab { border: 1px solid transparent; border-bottom: none; background: none; color: var(--muted); font: 600 14px var(--font); padding: 10px 16px; cursor: pointer; border-radius: 8px 8px 0 0; }
.tab.on { background: var(--card); color: var(--accent); border-color: var(--line); box-shadow: inset 0 3px 0 var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.card > h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 9px; text-align: center; vertical-align: middle; }
th { color: var(--muted); font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .04em; }
td.l, th.l { text-align: left; }
td .d { color: var(--muted); font-size: 12px; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); min-width: 2px; }
.barw { background: var(--line); border-radius: 4px; width: 110px; display: inline-block; vertical-align: middle; }
select, input[type=text] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
input[type=text] { width: 100%; min-width: 130px; }
button.act { font: 600 13px var(--font); padding: 7px 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; cursor: pointer; }
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .rail { display: flex; overflow-x: auto; gap: 8px; } .rail .q { min-width: 200px; } }
.rail { display: grid; gap: 8px; position: sticky; top: 8px; }
.q { text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 11px; cursor: pointer; font: 13px/1.4 var(--font); }
.q.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.q .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 5px; }
.chip { font: 600 12px var(--mono); padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--bg); white-space: pre-wrap; word-break: break-word; font-size: 14px; max-height: 240px; overflow: auto; }
.lab { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; }
.q-text { font-weight: 600; margin: 0 0 10px; white-space: pre-wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.fcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.fcard.pick { border-color: var(--good); box-shadow: 0 0 0 2px var(--good-soft); }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fhead b { font-size: 16px; }
.fdesc { color: var(--muted); font-size: 13px; margin-top: -4px; }
.good { border-left: 4px solid var(--good); background: var(--good-soft); padding: 6px 10px; border-radius: 6px; font-size: 14px; }
.imp { border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 7px 10px; font-size: 14px; display: grid; gap: 3px; }
.imp b { font: 600 11px var(--mono); text-transform: uppercase; color: var(--muted); margin-right: 5px; }
.imp .try b { color: var(--accent); }
.summary { background: var(--accent-soft); border-radius: 8px; padding: 7px 10px; font-weight: 500; font-size: 14px; }
.none { color: var(--muted); font-style: italic; font-size: 14px; }
.note { color: var(--muted); font-size: 13px; }
.teacher { border-left: 4px solid var(--ink); }
</style>
</head>
<body>
<header><h1 id="title">Feedback styles</h1>
<p class="sub">The marks are identical in every style, so only the feedback differs. Styles are ordered from shortest to longest. Rate each style in the table, choose a final pick, then copy your choices.</p></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>

<script>window.DATA = /*__DATA__*/null;</script>
<script>
(function () {
  var D = window.DATA, setIdx = 0, ansIdx = 0, KEY = "feedback-style-choices-v1";
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function fmt(x) { return x == null ? "-" : (Math.round(x * 100) / 100).toString(); }
  function pct(x) { return x == null ? "-" : Math.round(x * 100) + "%"; }
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { saved = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { /* storage may be off */ } }
  function choice(set, style) { var k = set.label; saved[k] = saved[k] || { pick: "", styles: {} }; saved[k].styles[style] = saved[k].styles[style] || { rating: "", note: "" }; return saved[k]; }

  function math(node) {
    if (!window.renderMathInElement) return;
    try { window.renderMathInElement(node, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "\\(", right: "\\)", display: false }, { left: "$", right: "$", display: false }], throwOnError: false }); } catch (e) { /* keep raw */ }
  }

  function card(title) { var c = el("section", "card"); c.appendChild(el("h2", "", title)); return c; }

  function summaryTable(set) {
    var c = card("Measured on all " + (set.answers.length ? "" : "") + "answers of the run, then your rating");
    var t = el("table"), hr = el("tr");
    ["Style", "Words", "Gaps named", "Has a reason", "Overlap with model answer", "Judge: explains why", "Judge: correct", "Judge: actionable", "Rewrite lift", "Transfer lift", "Your rating", "Final pick", "Notes"].forEach(function (h, i) { hr.appendChild(el("th", i === 0 ? "l" : "", h)); });
    t.appendChild(hr);
    var maxW = Math.max.apply(null, set.styles.map(function (s) { return s.stats.words; }).concat([1]));
    set.styles.forEach(function (s) {
      var st = s.stats, j = st.judge || {}, ch = choice(set, s.key), r = el("tr");
      var name = el("td", "l"); name.appendChild(el("b", "", s.label)); name.appendChild(el("div", "d", s.desc)); r.appendChild(name);
      var w = el("td"), bw = el("span", "barw"), bar = el("div", "bar"); bar.style.width = (100 * st.words / maxW) + "%"; bw.appendChild(bar);
      w.appendChild(bw); w.appendChild(el("div", "", String(Math.round(st.words)))); r.appendChild(w);
      r.appendChild(el("td", "", fmt(st.items)));
      r.appendChild(el("td", "", pct(st.with_why)));
      r.appendChild(el("td", "", pct(st.leak)));
      r.appendChild(el("td", "", pct(j.explains_why)));
      r.appendChild(el("td", "", pct(j.correct)));
      r.appendChild(el("td", "", pct(j.actionable)));
      r.appendChild(el("td", "", st.revision_lift == null ? "-" : "+" + fmt(st.revision_lift)));
      r.appendChild(el("td", "", st.transfer_lift == null ? "-" : "+" + fmt(st.transfer_lift)));
      var sel = el("select"); ["", "1", "2", "3", "4", "5"].forEach(function (v) { var o = el("option", "", v || "-"); o.value = v; if (ch.styles[s.key].rating === v) o.selected = true; sel.appendChild(o); });
      sel.onchange = function () { ch.styles[s.key].rating = sel.value; save(); };
      var td1 = el("td"); td1.appendChild(sel); r.appendChild(td1);
      var rad = el("input"); rad.type = "radio"; rad.name = "pick-" + set.label; rad.checked = ch.pick === s.key;
      rad.onchange = function () { ch.pick = s.key; save(); drawGrid.call(null); };
      var td2 = el("td"); td2.appendChild(rad); r.appendChild(td2);
      var inp = el("input"); inp.type = "text"; inp.placeholder = "wording, length, tone..."; inp.value = ch.styles[s.key].note;
      inp.oninput = function () { ch.styles[s.key].note = inp.value; save(); };
      var td3 = el("td"); td3.appendChild(inp); r.appendChild(td3);
      t.appendChild(r);
    });
    c.appendChild(t);
    c.appendChild(el("p", "note", "Words and gaps named are averages over the whole run. Judge scores are from a small model and are probably generous. Rewrite lift and transfer lift are the mark gains of a simulated student who sees only the feedback, on the same question and on a different one (blank where not run). Overlap is the share of the model answer's 4-word phrases that appear in the feedback."));
    var b = el("button", "act", "Copy my choices"), msg = el("span", "note", "");
    b.onclick = function () {
      var text = JSON.stringify(saved, null, 2);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { msg.textContent = " copied"; }, function () { msg.textContent = " copy failed: select the text below"; });
      else msg.textContent = " clipboard not available";
      out.value = text; out.hidden = false;
    };
    var out = el("textarea"); out.rows = 8; out.style.width = "100%"; out.hidden = true; out.style.marginTop = "8px";
    var row = el("div"); row.appendChild(b); row.appendChild(msg); c.appendChild(row); c.appendChild(out);
    return c;
  }

  var gridHost = null;
  function drawGrid() {
    if (!gridHost) return;
    var set = D.sets[setIdx], a = set.answers[ansIdx], pick = choice(set, set.styles[0].key).pick;
    gridHost.innerHTML = "";

    var ctx = card("The question, the answer and the marks");
    ctx.appendChild(el("p", "q-text", a.question));
    var cols = el("div", "cols");
    var c1 = el("div"); c1.appendChild(el("div", "lab", "Model answer")); c1.appendChild(el("div", "box", a.model_answer)); cols.appendChild(c1);
    var c2 = el("div"); c2.appendChild(el("div", "lab", "Student answer")); c2.appendChild(el("div", "box", a.student_answer || "(empty)")); cols.appendChild(c2);
    var c3 = el("div"); c3.appendChild(el("div", "lab", "Marks"));
    var mk = el("div", "box"); mk.textContent = "Teacher: " + fmt(a.human_mark) + " / " + fmt(a.max_mark) + "\nThis system: " + fmt(a.predicted) + " / " + fmt(a.max_mark) + " (same in every style)"; c3.appendChild(mk);
    if (a.human_feedback) { c3.appendChild(el("div", "lab", "Teacher's own feedback")); c3.appendChild(el("div", "box teacher", a.human_feedback)); }
    cols.appendChild(c3); ctx.appendChild(cols); gridHost.appendChild(ctx);
    math(ctx);

    var grid = el("div", "grid");
    set.styles.forEach(function (s) {
      var fb = a.feedback[s.key], f = el("div", "fcard" + (pick === s.key ? " pick" : ""));
      var h = el("div", "fhead"); h.appendChild(el("b", "", s.label));
      var words = fb ? [].concat(fb.strengths, [fb.summary], fb.improvements.map(function (x) { return [x.issue, x.why, x.fix].join(" "); })).join(" ").split(/\s+/).filter(Boolean).length : 0;
      h.appendChild(el("span", "chip", words + " words, " + (fb ? fb.improvements.length : 0) + " gaps")); f.appendChild(h);
      f.appendChild(el("div", "fdesc", s.desc));
      if (!fb) f.appendChild(el("div", "none", "Not available for this answer."));
      else {
        fb.strengths.forEach(function (x) { f.appendChild(el("div", "good", x)); });
        fb.improvements.forEach(function (x) {
          var d = el("div", "imp"); d.appendChild(el("div", "", x.issue));
          if (x.why) { var w = el("div"); w.appendChild(el("b", "", "Why")); w.appendChild(document.createTextNode(x.why)); d.appendChild(w); }
          var tr = el("div", "try"); tr.appendChild(el("b", "", "Try")); tr.appendChild(document.createTextNode(x.fix)); d.appendChild(tr); f.appendChild(d);
        });
        if (!fb.strengths.length && !fb.improvements.length) f.appendChild(el("div", "none", "(no items: the answer earned full marks or nothing)"));
        f.appendChild(el("div", "summary", fb.summary));
      }
      grid.appendChild(f);
    });
    gridHost.appendChild(grid);
    math(grid);
  }

  function draw() {
    var tabs = document.getElementById("tabs"); tabs.innerHTML = "";
    D.sets.forEach(function (s, i) { var b = el("button", "tab" + (i === setIdx ? " on" : ""), s.label); b.onclick = function () { setIdx = i; ansIdx = 0; draw(); }; tabs.appendChild(b); });
    var main = document.getElementById("main"); main.innerHTML = "";
    var set = D.sets[setIdx];
    main.appendChild(summaryTable(set));
    var layout = el("div", "layout"), rail = el("div", "rail"); gridHost = el("div");
    set.answers.forEach(function (a, i) {
      var b = el("button", "q" + (i === ansIdx ? " on" : "")); b.appendChild(el("div", "t", a.question));
      b.appendChild(el("span", "chip", "teacher " + fmt(a.human_mark) + "/" + fmt(a.max_mark)));
      b.onclick = function () { ansIdx = i; draw(); }; rail.appendChild(b);
    });
    layout.appendChild(rail); layout.appendChild(gridHost); main.appendChild(layout);
    drawGrid();
  }
  document.getElementById("title").textContent = D.title; document.title = D.title;
  window.__redraw = drawGrid;
  draw();
})();
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" onload="if(window.__redraw)window.__redraw()"></script>
</body>
</html>
