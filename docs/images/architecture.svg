<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs><rect x="1" y="1" width="1398" height="998" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="32" y="44" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Where things live in the repository</text><text x="32" y="70" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Arrows show what uses what. The web app does no marking itself: it starts the command-line tool.</text><rect x="32" y="96" width="678" height="130" rx="16" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="7 6"/><text x="48" y="120" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="start">How people use it</text><rect x="60" y="128" width="270" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="195.0" y="155.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Command line</text><text x="195.0" y="177.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">src/autograde/cli/</text><rect x="420" y="128" width="270" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="555.0" y="155.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Web app</text><text x="555.0" y="177.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">app/  (Streamlit)</text><line x1="418" y1="168" x2="332" y2="168" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="375.0" y="158" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">starts</text><rect x="32" y="262" width="1050" height="330" rx="16" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="7 6"/><text x="1066" y="286" font-size="13" font-weight="700" fill="#2563eb" text-anchor="end">The marking engine  (src/autograde/)</text><line x1="195.0" y1="210" x2="195.0" y2="298" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="60" y="300" width="270" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="195.0" y="323.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">intake/</text><text x="195.0" y="345.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">turns exam files into</text><text x="195.0" y="363.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">questions and answers</text><rect x="420" y="300" width="270" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="555.0" y="323.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">pipeline/</text><text x="555.0" y="345.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">writes the scheme, marks,</text><text x="555.0" y="363.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">checks, writes feedback</text><rect x="780" y="300" width="270" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="915.0" y="323.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">viewer/</text><text x="915.0" y="345.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">builds the</text><text x="915.0" y="363.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">report.html page</text><line x1="332" y1="345" x2="418" y2="345" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><line x1="692" y1="345" x2="778" y2="345" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="735.0" y="335" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">finished marks</text><rect x="60" y="450" width="270" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="195.0" y="473.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">ocr/</text><text x="195.0" y="495.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">reads handwritten sheets</text><text x="195.0" y="513.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">into text</text><rect x="420" y="450" width="270" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="555.0" y="473.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">llm/</text><text x="555.0" y="495.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">one way to call</text><text x="555.0" y="513.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">any AI model</text><rect x="780" y="450" width="270" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="915.0" y="473.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">prompts/</text><text x="915.0" y="495.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">every instruction to</text><text x="915.0" y="513.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">the AI, as text files</text><line x1="195.0" y1="448" x2="195.0" y2="392" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="239.0" y="424" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">text for</text><line x1="555.0" y1="392" x2="555.0" y2="448" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="605.0" y="424" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">asks the AI</text><path d="M 640 392 V 420 H 915.0 V 448" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="792.5" y="412" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">reads the instructions</text><rect x="32" y="632" width="1050" height="130" rx="16" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6"/><text x="48" y="656" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Outside services</text><rect x="60" y="662" width="270" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="195.0" y="689.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Indic handwriting reader</text><text x="195.0" y="711.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">Bodhan (optional)</text><rect x="420" y="662" width="270" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="555.0" y="680.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">AI models</text><text x="555.0" y="702.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">OpenRouter online,</text><text x="555.0" y="720.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">or the offline mock</text><line x1="195.0" y1="542" x2="195.0" y2="660" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="231.0" y="618" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">internet</text><line x1="555.0" y1="542" x2="555.0" y2="660" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="591.0" y="618" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">internet</text><rect x="1110" y="262" width="258" height="330" rx="16" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="7 6"/><text x="1126" y="286" font-size="13" font-weight="700" fill="#d97706" text-anchor="start">Tools for testing the grader</text><rect x="1130" y="300" width="218" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="1239.0" y="323.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">evaluation/</text><text x="1239.0" y="345.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">measures how accurate</text><text x="1239.0" y="363.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">and steady it is</text><rect x="1130" y="450" width="218" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="1239.0" y="473.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">datasets/</text><text x="1239.0" y="495.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">public marked answers</text><text x="1239.0" y="513.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">(downloaded, not stored)</text><line x1="1239" y1="392" x2="1239" y2="448" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="1262" y="424" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">uses</text><line x1="1128" y1="345" x2="1086" y2="345" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head)"/><text x="1107" y="324" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">tests</text><text x="32" y="806" font-size="14" font-weight="700" fill="#6b7280" text-anchor="start">Files written while it runs (none of these are stored in git)</text><rect x="32" y="822" width="246" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="155.0" y="845.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">output/runs/</text><text x="155.0" y="867.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">marks, feedback and reports,</text><text x="155.0" y="885.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">one folder per run</text><rect x="294" y="822" width="246" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="417.0" y="845.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">output/rubrics/</text><text x="417.0" y="867.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">saved marking schemes,</text><text x="417.0" y="885.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">so each is written once</text><rect x="556" y="822" width="246" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="679.0" y="845.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">output/logs/</text><text x="679.0" y="867.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">autograde.log, a record</text><text x="679.0" y="885.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">of every command</text><rect x="818" y="822" width="246" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="941.0" y="845.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">app_data/</text><text x="941.0" y="867.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">web app users and</text><text x="941.0" y="885.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">uploaded exams</text><text x="32" y="979" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Colours:</text><rect x="102" y="966" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="128" y="980" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">how people start it</text><rect x="289" y="966" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="315" y="980" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">marking engine</text><rect x="441" y="966" width="18" height="18" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/><text x="467" y="980" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">support code</text><rect x="579" y="966" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="605" y="980" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">testing the grader</text><rect x="759" y="966" width="18" height="18" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="785" y="980" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">outside services and files</text></svg>
