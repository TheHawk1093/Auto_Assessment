<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" width="1400" height="1010" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs><rect x="1" y="1" width="1398" height="1008" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="32" y="44" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">What happens to one student answer</text><text x="32" y="70" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Steps 3 to 7 repeat for every answer. The name on the right is the function that does the step.</text><rect x="120" y="100" width="1000" height="84" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><circle cx="76" cy="142.0" r="20" fill="#7c3aed"/><text x="76" y="148.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="144" y="134" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Read the teacher&#x27;s files</text><text x="144" y="162" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">The question paper, answer key and student answers become one item per answer.</text><rect x="904.0" y="112" width="196.0" height="30" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="1002.0" y="132" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1f2937" text-anchor="middle">cmd_exam  /  intake/</text><line x1="620.0" y1="186" x2="620.0" y2="204" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="120" y="206" width="1000" height="84" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><circle cx="76" cy="248.0" r="20" fill="#7c3aed"/><text x="76" y="254.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="144" y="240" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Get a marking scheme for the question</text><text x="144" y="268" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">A list of points worth marks, written once, tested (full marks for the model answer, zero for a blank), then saved.</text><rect x="946.0" y="218" width="154.0" height="30" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="1023.0" y="238" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1f2937" text-anchor="middle">RubricStore.get</text><line x1="620.0" y1="292" x2="620.0" y2="310" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="120" y="312" width="1000" height="84" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="76" cy="354.0" r="20" fill="#2563eb"/><text x="76" y="360.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="144" y="346" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Let code settle what code can</text><text x="144" y="374" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Multiple choice, numbers with units, code and figures are checked by fixed rules, not by the AI.</text><rect x="988.0" y="324" width="112.0" height="30" rx="15" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="1044.0" y="344" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1f2937" text-anchor="middle">run_checks</text><line x1="620.0" y1="398" x2="620.0" y2="416" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="120" y="418" width="1000" height="84" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="76" cy="460.0" r="20" fill="#2563eb"/><text x="76" y="466.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="144" y="452" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Read the answer by itself</text><text x="144" y="480" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">The AI first summarises what the student wrote, before comparing it with the scheme.</text><rect x="979.6" y="430" width="120.4" height="30" rx="15" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="1039.8" y="450" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1f2937" text-anchor="middle">read_answer</text><line x1="620.0" y1="504" x2="620.0" y2="522" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="120" y="524" width="1000" height="84" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="76" cy="566.0" r="20" fill="#2563eb"/><text x="76" y="572.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="144" y="558" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Judge each point</text><text x="144" y="586" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">For every point the AI says earned, partly earned or missed, and quotes the student&#x27;s own words as proof.</text><rect x="979.6" y="536" width="120.4" height="30" rx="15" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="1039.8" y="556" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1f2937" text-anchor="middle">mark_answer</text><line x1="620.0" y1="610" x2="620.0" y2="628" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="120" y="630" width="1000" height="84" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><circle cx="76" cy="672.0" r="20" fill="#dc2626"/><text x="76" y="678.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="144" y="664" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Check the AI&#x27;s work with code</text><text x="144" y="692" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Is each quote really in the answer? Do the marks add up? Are the limits respected? Anything left over is flagged.</text><rect x="870.4" y="642" width="229.60000000000002" height="30" rx="15" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/><text x="985.2" y="662" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1f2937" text-anchor="middle">check_grading  /  repair</text><line x1="620.0" y1="716" x2="620.0" y2="734" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="120" y="736" width="1000" height="84" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><circle cx="76" cy="778.0" r="20" fill="#059669"/><text x="76" y="784.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="144" y="770" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Write feedback</text><text x="144" y="798" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Using only the checked marking: what went well and what was missed. Skipped when the answer gets full marks.</text><rect x="954.4" y="748" width="145.60000000000002" height="30" rx="15" fill="#ffffff" stroke="#059669" stroke-width="1.2"/><text x="1027.2" y="768" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1f2937" text-anchor="middle">write_feedback</text><line x1="620.0" y1="822" x2="620.0" y2="840" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="120" y="842" width="1000" height="84" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><circle cx="76" cy="884.0" r="20" fill="#059669"/><text x="76" y="890.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="144" y="876" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Save the results</text><text x="144" y="904" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">marks.csv, one file per student, schemes.md and results.jsonl, in output/runs/&lt;name&gt;/.</text><rect x="996.4" y="854" width="103.60000000000001" height="30" rx="15" fill="#ffffff" stroke="#059669" stroke-width="1.2"/><text x="1048.2" y="874" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1f2937" text-anchor="middle">run_items</text><rect x="104" y="298" width="1032" height="536" rx="16" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6"/><text x="120" y="322" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start"></text><text x="1150" y="304" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Repeated for</text><text x="1150" y="322" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">every answer, several</text><text x="1150" y="340" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">at a time. A run that</text><text x="1150" y="358" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">stops can be resumed.</text><path d="M 1136 672.0 H 1176 V 566.0 H 1138" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head)"/><text x="1186" y="616" font-size="13" font-weight="400" fill="#dc2626" text-anchor="start">If a check fails:</text><text x="1186" y="634" font-size="13" font-weight="400" fill="#dc2626" text-anchor="start">redo step 5 once,</text><text x="1186" y="652" font-size="13" font-weight="400" fill="#dc2626" text-anchor="start">then repair it.</text><text x="32" y="989" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Colours:</text><rect x="102" y="976" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="128" y="990" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">set-up, once per exam</text><rect x="303" y="976" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="329" y="990" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">marking, per answer</text><rect x="490" y="976" width="18" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="516" y="990" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">checked by code</text><rect x="649" y="976" width="18" height="18" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/><text x="675" y="990" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">output</text></svg>
