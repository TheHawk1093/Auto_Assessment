<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs><rect x="1" y="1" width="1398" height="838" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="32" y="44" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Reading handwritten answer sheets</text><text x="32" y="70" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">You choose the main reader and the fallbacks. They are tried in order until one gives a clean result.</text><rect x="32" y="100" width="560" height="64" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="312.0" y="119.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Photos of the answer sheet</text><text x="312.0" y="141.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">one image per page</text><rect x="32" y="210" width="560" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="312.0" y="239.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Step 1: the main reader</text><text x="312.0" y="261.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">you choose it: ocr.reader in configs/exam.yaml</text><text x="312.0" y="279.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">default: Gemini 3.1 Flash-Lite, through OpenRouter</text><text x="312.0" y="297.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">a clean result is used straight away</text><rect x="32" y="400" width="560" height="160" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="312.0" y="440.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Step 2: the fallbacks, in order</text><text x="312.0" y="462.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">tried only if the step before was passed over</text><text x="312.0" y="480.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">default 1: Gemini 3.5 Flash-Lite, through OpenRouter</text><text x="312.0" y="498.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">default 2: Bodhan IndicOCR, a specialist for Indian scripts</text><text x="312.0" y="516.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">you can add, remove or reorder them: ocr.fallbacks</text><rect x="32" y="630" width="560" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="312.0" y="653.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">The text for the sheet</text><text x="312.0" y="675.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">from the first clean reader, so each sheet</text><text x="312.0" y="693.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">records which reader produced it</text><line x1="312.0" y1="166" x2="312.0" y2="208" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><line x1="312.0" y1="332" x2="312.0" y2="398" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="364.0" y="370" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">passed over</text><line x1="312.0" y1="562" x2="312.0" y2="628" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><text x="382.0" y="600" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">first clean result</text><path d="M 594 270 H 626 V 675 H 596" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#head)"/><text x="653" y="470" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">clean</text><rect x="680" y="100" width="688" height="210" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="1024.0" y="165.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">A reader is passed over when</text><text x="1024.0" y="187.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">it fails or returns an error</text><text x="1024.0" y="205.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">it reads nothing</text><text x="1024.0" y="223.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">over 25% of the words are marked as uncertain</text><text x="1024.0" y="241.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">one word fills over 40% of a long page (the reader is stuck)</text><rect x="680" y="340" width="688" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="1024.0" y="374.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">If no reader gives a clean result</text><text x="1024.0" y="396.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">the least doubtful read is kept, and the sheet is marked as degraded in scan.json</text><text x="1024.0" y="414.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">if every reader fails, the sheet is reported as failed</text><text x="1024.0" y="432.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">run the command again to retry only those sheets</text><rect x="680" y="500" width="688" height="220" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="1024.0" y="561.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">What each reader needs and costs</text><text x="1024.0" y="583.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">openrouter:  OPENROUTER_API_KEY. Paid models are allowed; a run stops</text><text x="1024.0" y="601.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">if the cost OpenRouter reports passes $1 (raise it with AUTOGRADE_OCR_CAP_USD)</text><text x="1024.0" y="619.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">bodhan:  INDIC_OCR_API_KEY. About Rs 0.20 an image, stops at Rs 30 a run</text><text x="1024.0" y="637.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">gemini (direct):  GEMINI_API_KEY, free tier only. It may keep the images</text><text x="1024.0" y="655.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">claude_cli:  your Claude Code login</text><text x="32" y="760" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Optional: add a route to also re-read every page that looks Indic (30% or more of its letters in an Indian script), even when the main reader was clean.</text><text x="32" y="819" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Colours:</text><rect x="102" y="806" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="128" y="820" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">readers</text><rect x="205" y="806" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="231" y="820" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">when a reader is passed over</text><rect x="455" y="806" width="18" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="481" y="820" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">when none is clean</text><rect x="635" y="806" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="661" y="820" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">keys and costs</text><rect x="787" y="806" width="18" height="18" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/><text x="813" y="820" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">result</text></svg>
