<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs><rect x="1" y="1" width="1398" height="598" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="32" y="44" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">How autograde works</text><text x="32" y="70" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">You give it the exam files and it returns marks and feedback. Code double-checks everything the AI decides.</text><rect x="32" y="120" width="200" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="132.0" y="160.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Question paper</text><rect x="32" y="214" width="200" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="132.0" y="236.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Answer key</text><text x="132.0" y="258.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">model answers or rubric</text><rect x="32" y="308" width="200" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="132.0" y="330.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Student answers</text><text x="132.0" y="352.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">typed or photographed</text><line x1="234" y1="155" x2="296" y2="215" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><line x1="234" y1="249" x2="296" y2="250" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><line x1="234" y1="343" x2="296" y2="285" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="298" y="190" width="190" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="393.0" y="219.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">1  Read the files</text><text x="393.0" y="241.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">turn the paper, key and</text><text x="393.0" y="259.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">answers into one item</text><text x="393.0" y="277.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">per student answer</text><text x="393.0" y="336" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">in intake/</text><line x1="490" y1="250" x2="520" y2="250" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="522" y="190" width="190" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="617.0" y="219.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">2  Write a scheme</text><text x="617.0" y="241.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">a list of points worth</text><text x="617.0" y="259.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">marks for each question,</text><text x="617.0" y="277.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">tested before use</text><text x="617.0" y="336" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">in rubric.py</text><line x1="714" y1="250" x2="744" y2="250" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="746" y="190" width="190" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="841.0" y="219.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">3  Mark each answer</text><text x="841.0" y="241.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">the AI judges each point</text><text x="841.0" y="259.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">and quotes the student;</text><text x="841.0" y="277.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">code checks the quote</text><text x="841.0" y="336" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">in run.py</text><line x1="938" y1="250" x2="968" y2="250" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="970" y="190" width="190" height="120" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="1065.0" y="219.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">4  Write feedback</text><text x="1065.0" y="241.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">says what was good and</text><text x="1065.0" y="259.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">what was missed, using</text><text x="1065.0" y="277.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">only the checked marks</text><text x="1065.0" y="336" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">in feedback.py</text><rect x="1186" y="190" width="182" height="120" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="1277.0" y="219.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Results</text><text x="1277.0" y="241.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">marks.csv</text><text x="1277.0" y="259.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">feedback per student</text><text x="1277.0" y="277.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">report.html</text><line x1="1162" y1="250" x2="1184" y2="250" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="298" y="380" width="1070" height="130" rx="16" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6"/><text x="314" y="404" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Every call to the AI goes through one gateway (the llm/ folder)</text><text x="320" y="440" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Pick the model with one setting in the config file: OpenRouter online, or the offline mock.</text><text x="320" y="468" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Every instruction given to the AI is a plain text file in prompts/, so it can be edited.</text><line x1="617.0" y1="346" x2="617.0" y2="378" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head)"/><line x1="841.0" y1="346" x2="841.0" y2="378" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head)"/><line x1="1065.0" y1="346" x2="1065.0" y2="378" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head)"/><text x="32" y="579" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Colours:</text><rect x="102" y="566" width="18" height="18" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="128" y="580" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">what you provide</text><rect x="268" y="566" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="294" y="580" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">reading the files</text><rect x="441" y="566" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="467" y="580" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">marking</text><rect x="544" y="566" width="18" height="18" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/><text x="570" y="580" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">what you get back</text></svg>
