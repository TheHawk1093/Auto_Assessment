<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs><rect x="1" y="1" width="1398" height="398" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="32" y="44" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Using the web app</text><text x="32" y="70" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">A teacher prepares and marks an exam, then publishes it. Students see only their own results.</text><rect x="32" y="120" width="190" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="127.0" y="153.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Upload</text><text x="127.0" y="175.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">add the paper, answer</text><text x="127.0" y="193.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">key and answers or scans</text><text x="48" y="144" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">1</text><line x1="225" y1="175" x2="255" y2="175" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="258" y="120" width="190" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="353.0" y="153.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Prepare</text><text x="353.0" y="175.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">a marking scheme is</text><text x="353.0" y="193.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">written for each question</text><text x="274" y="144" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">2</text><line x1="451" y1="175" x2="481" y2="175" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="484" y="120" width="190" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="579.0" y="153.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Mark</text><text x="579.0" y="175.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">the AI marks every answer</text><text x="579.0" y="193.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">in the background</text><text x="500" y="144" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">3</text><line x1="677" y1="175" x2="707" y2="175" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="710" y="120" width="190" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="805.0" y="153.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Review</text><text x="805.0" y="175.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">check flagged answers</text><text x="805.0" y="193.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">and change any mark</text><text x="726" y="144" font-size="13" font-weight="700" fill="#d97706" text-anchor="start">4</text><line x1="903" y1="175" x2="933" y2="175" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="936" y="120" width="190" height="110" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="1031.0" y="153.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Publish</text><text x="1031.0" y="175.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">only students enrolled</text><text x="1031.0" y="193.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">in the course can see it</text><text x="952" y="144" font-size="13" font-weight="700" fill="#059669" text-anchor="start">5</text><line x1="1129" y1="175" x2="1159" y2="175" stroke="#9ca3af" stroke-width="2" marker-end="url(#head)"/><rect x="1162" y="120" width="190" height="110" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="1257.0" y="153.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Results</text><text x="1257.0" y="175.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">each student sees their</text><text x="1257.0" y="193.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">marks and feedback</text><text x="1178" y="144" font-size="13" font-weight="700" fill="#059669" text-anchor="start">6</text><path d="M 1257.0 233 V 290 H 805.0 V 233" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head)"/><text x="1031.0" y="316" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">If a student disagrees with a mark they can request a regrade, and the teacher decides</text><text x="32" y="379" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Colours:</text><rect x="102" y="366" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="128" y="380" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">teacher prepares and marks</text><rect x="338" y="366" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="364" y="380" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">teacher decides</text><rect x="497" y="366" width="18" height="18" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/><text x="523" y="380" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">students see it</text><rect x="656" y="366" width="18" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="682" y="380" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">regrade request</text></svg>
